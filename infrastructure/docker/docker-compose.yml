version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: patentrack-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: patentrack
      POSTGRES_USER: patentrack
      POSTGRES_PASSWORD: patentrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patentrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: patentrack-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
